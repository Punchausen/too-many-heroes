<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Too Many Heroes - Canvas Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/client.js" defer></script>
</head>
<body style="background: #000; margin: 0; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; overflow-x: hidden;">

    <div style="position: relative; border: 4px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: #111;">
        <canvas id="gameCanvas" width="960" height="640" style="display: block; cursor: pointer;"></canvas>
    </div>

    <div id="combat-log-overlay" style="width: 952px; height: 100px; background: #0a0a0a; border: 4px solid #222; border-top: none; padding: 10px; color: #00ff00; font-size: 13px; overflow-y: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: none;">
        <div style="color: #888; border-bottom: 1px dashed #333; padding-bottom: 4px; margin-bottom: 6px;">MASTER REF CONTROL LOG TERMINAL LINE:</div>
    </div>

</body>
</html>
