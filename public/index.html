<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Too Many Heroes - Canvas Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/client.js" defer></script>
</head>
<body style="background: #000; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; overflow: hidden;">

    <div style="position: relative; border: 4px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.8);">
        <canvas id="gameCanvas" width="960" height="640" style="display: block; background: #111; cursor: pointer;"></canvas>
        
        <div id="combat-log-overlay" style="position: absolute; bottom: 10px; left: 10px; right: 10px; height: 120px; background: rgba(0,0,0,0.85); border: 1px solid #333; padding: 10px; color: #00ff00; font-size: 12px; overflow-y: auto; pointer-events: none; display: none;"></div>
    </div>

</body>
</html>
